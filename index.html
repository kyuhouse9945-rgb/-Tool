<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>エアコン修理 週間集計ツール</title>
  <style>
    :root{
      --bg1: rgba(236,253,245,0.98);
      --bg2: rgba(209,250,229,0.70);
      --card: rgba(255,255,255,0.95);
      --line: rgba(167,243,208,0.95);
      --text: #064e3b;
      --muted: rgba(6,78,59,0.65);
      --primary: rgba(16,185,129,0.96);
      --primary2: rgba(4,120,87,0.98);
      --shadow: 0 12px 26px rgba(4,120,87,0.08);
      --radius: 20px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top left,var(--bg2),transparent 36%),linear-gradient(180deg,var(--bg1),rgba(255,255,255,0.98));
      -webkit-tap-highlight-color:transparent;
      padding-bottom:32px;
    }
    .app{max-width:760px;margin:0 auto;padding:16px 12px;}
    
    .header-bar{text-align:center;margin-bottom:16px;padding-bottom:16px;border-bottom:2px solid var(--line);}
    .header-bar h1{margin:0 0 12px;font-size:20px;color:var(--primary2);line-height:1.2;}
    
    .week-select-wrap{position:relative;display:inline-block;width:100%;max-width:320px;}
    select.week-select{-webkit-appearance:none;appearance:none;width:100%;border-radius:12px;border:2px solid var(--primary);font-size:15px;font-weight:900;background:rgba(255,255,255,0.9);color:var(--primary2);padding:10px 40px 10px 16px;text-align:center;cursor:pointer;}
    .week-select-wrap::after{content:"▼";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--primary2);pointer-events:none;}

    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
    
    /* タブ */
    .tab-bar{display:flex;gap:4px;margin-bottom:16px;}
    .tab-btn{flex:1;min-height:44px;font-size:12px;font-weight:900;border:2px solid var(--line);border-radius:12px;background:rgba(255,255,255,0.9);color:var(--muted);cursor:pointer;transition:all 0.2s;padding:0;}
    .tab-btn.active{background:linear-gradient(180deg,var(--primary),rgba(5,150,105,0.98));color:#fff;border-color:transparent;}

    /* フィルタ */
    .filter-row{display:flex;gap:8px;margin-bottom:16px;}
    .filter-row select{-webkit-appearance:none;appearance:none;flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:700;background:rgba(255,255,255,0.9) url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23047857' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 10px center/14px;padding:0 30px 0 12px;color:var(--text);}

    /* リストアイテム */
    .person-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;}
    
    /* 均等サイズの情報テキスト */
    .pc-info-text {
      flex: 1;
      padding-right: 8px;
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }
    .pc-info-text .sep {
      color: var(--muted);
      font-weight: normal;
      margin: 0 4px;
    }
    .pc-info-text .name {
      color: var(--primary2);
    }
    
    .pc-btns{display:flex;gap:6px;flex-shrink:0;}
    .btn-circle{width:48px;height:48px;border-radius:12px;border:none;font-size:22px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.1s;}
    .btn-circle:active{transform:scale(0.92);}
    .btn-circle.minus{background:rgba(254,226,226,0.9);color:#dc2626;}
    .btn-circle.plus{background:linear-gradient(180deg,var(--primary),rgba(5,150,105,0.98));color:#fff;box-shadow:0 4px 10px rgba(16,185,129,0.3);}

    /* 追加フォーム用 */
    .form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
    .form-input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;width:100%;}
    .form-input:focus{outline:2px solid rgba(16,185,129,0.3);border-color:var(--primary);}
    .btn-primary{background:linear-gradient(180deg,var(--primary),rgba(5,150,105,0.98));color:#fff;border:none;padding:12px;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;}
    .btn-danger{background:rgba(254,226,226,0.9);color:#dc2626;border:none;padding:8px 14px;border-radius:8px;font-weight:900;font-size:12px;cursor:pointer;}

    /* プログレスバー */
    .prog-wrap{background:rgba(0,0,0,0.06);border-radius:99px;height:10px;overflow:hidden;}
    .prog-bar{height:100%;border-radius:99px;transition:width 0.4s ease;}
    .prog-bar.red{background:linear-gradient(90deg,#f87171,#ef4444);}
    .prog-bar.yellow{background:linear-gradient(90deg,#fbbf24,#f59e0b);}
    .prog-bar.green{background:linear-gradient(90deg,#34d399,#10b981);}
    .prog-bar.gray{background:#d1d5db;}

    /* 集計パネル */
    .summary-box{text-align:center;padding:20px 12px;background:rgba(209,250,229,0.3);border-radius:16px;border:1px solid var(--line);margin-bottom:20px;box-shadow:0 4px 12px rgba(4,120,87,0.04);}
    .summary-box .title{font-size:14px;font-weight:900;color:var(--primary2);margin-bottom:8px;}
    .summary-box .rate{font-size:52px;font-weight:1000;color:var(--primary2);line-height:1;margin-bottom:8px;}
    .summary-box .nums{font-size:15px;font-weight:900;color:var(--text);margin-top:12px;}

    .area-group{margin-bottom:20px;}
    .area-title{font-size:14px;font-weight:900;color:#fff;background:var(--primary2);padding:6px 12px;border-radius:10px;margin-bottom:8px;display:inline-block;}
    .area-row{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px 16px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;}
    .area-row .ar-name{font-size:14px;font-weight:900;color:var(--text);}

    /* 目標設定用 */
    .cap-input{width:70px;height:40px;border-radius:10px;border:2px solid var(--line);text-align:center;font-size:16px;font-weight:900;color:var(--text);background:#f8fafc;}
    .cap-input:focus{outline:none;border-color:var(--primary);background:#fff;}

    /* トースト */
    .toast{position:fixed;top:40px;left:50%;transform:translate(-50%,-20px);background:rgba(4,120,87,0.95);color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:900;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:1000;opacity:0;pointer-events:none;transition:all 0.3s;}
    .toast.show{opacity:1;transform:translate(-50%,0);}
    
    .empty-msg{text-align:center;padding:32px 16px;color:var(--muted);font-size:14px;font-weight:700;}
  </style>
</head>

// データ管理 (localStorage)
// ==========================================
var STORAGE_KEY = "ac_weekly_aggregator_v5";
var db = { master: [], capacities: {}, records: {} };

function loadDb() {
  try {
    var data = localStorage.getItem(STORAGE_KEY);
    if(data) db = JSON.parse(data);
  } catch(e) {}
  
  if(!db.master || db.master.length === 0) {
    db.master = JSON.parse(JSON.stringify(DEFAULT_MASTER));
  }
  if(!db.capacities) db.capacities = {};
  if(!db.records) db.records = {};
}

function saveDb() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  } catch(e) {}
}

var toastTimer = null;
function showToast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.className = "toast show";
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = "toast"; }, 2000);
}

// 日付・週のロジック
// ==========================================
function getMonday(d) {
  d = new Date(d);
  var day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(d.setDate(diff));
}
function formatDate(d) {
  var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return y + "-" + m + "-" + dd;
}
function getWeekLabel(mondayStr) {
  var md = new Date(mondayStr);
  var su = new Date(md);
  su.setDate(su.getDate() + 6);
  var mdStr = (md.getMonth()+1) + "/" + md.getDate();
  var suStr = (su.getMonth()+1) + "/" + su.getDate();
  return md.getFullYear() + "年 (" + mdStr + "〜" + suStr + ")";
}

function initWeekSelect() {
  var sel = $("weekSelect");
  var today = new Date();
  var currentMonday = getMonday(today);
  
  var html = "";
  for(var i = -5; i <= 5; i++) {
    var d = new Date(currentMonday);
    d.setDate(d.getDate() + (i * 7));
    var val = formatDate(d);
    var label = getWeekLabel(val);
    if(i === 0) label = "【今週】 " + label;
    var selected = (i === 0) ? "selected" : "";
    html += '<option value="' + val + '" ' + selected + '>' + label + '</option>';
  }
  sel.innerHTML = html;
}

// ==========================================
// フィルタの初期化
// ==========================================
function initFilters() {
  var oldSite = $("fltSite").value; 
  
  var sites = unique(db.master.map(function(m){ return m.site; })).sort();
  var siteHtml = '<option value="">すべての拠点</option>';
  sites.forEach(function(s){ siteHtml += '<option value="'+escHtml(s)+'">'+escHtml(s)+'</option>'; });
  $("fltSite").innerHTML = siteHtml;
  
  if(sites.indexOf(oldSite) !== -1) $("fltSite").value = oldSite;
  onSiteFilterChange();
}

function onSiteFilterChange() {
  var oldArea = $("fltArea").value;
  var site = $("fltSite").value;
  
  var areas = unique(db.master.filter(function(m){ return !site || m.site === site; }).map(function(m){ return m.area; })).sort();
  var areaHtml = '<option value="">すべてのエリア</option>';
  areas.forEach(function(a){ areaHtml += '<option value="'+escHtml(a)+'">'+escHtml(a)+'</option>'; });
  $("fltArea").innerHTML = areaHtml;
  
  if(areas.indexOf(oldArea) !== -1) $("fltArea").value = oldArea;
  renderCurrentTab();
}

function getFilteredData() {
  var site = $("fltSite").value;
  var area = $("fltArea").value;
  return db.master.filter(function(m){
    return (!site || m.site === site) && (!area || m.area === area);
  });
}

// ==========================================
// プログレスバー・達成率の計算
// ==========================================
function calcRate(cap, rec) {
  if(!cap || cap <= 0) return 0;
  return Math.floor((rec / cap) * 100);
}
function getBarColor(rate, cap) {
  if(!cap || cap <= 0) return "gray";
  if(rate >= 100) return "green";
  if(rate >= 50) return "yellow";
  return "red";
}
function renderBar(rate, cap) {
  var c = getBarColor(rate, cap);
  var w = Math.min(100, rate);
  return '<div class="prog-wrap"><div class="prog-bar '+c+'" style="width:'+w+'%"></div></div>';
}

// ==========================================
// タブ描画ロジック
// ==========================================
var currentTab = "input";

function switchTab(tab) {
  currentTab = tab;
  $("btnTabInput").className = "tab-btn" + (tab === "input" ? " active" : "");
  $("btnTabCap").className = "tab-btn" + (tab === "cap" ? " active" : "");
  $("btnTabArea").className = "tab-btn" + (tab === "area" ? " active" : "");
  $("btnTabStaff").className = "tab-btn" + (tab === "staff" ? " active" : "");
  
  $("paneInput").style.display = (tab === "input" ? "block" : "none");
  $("paneCap").style.display = (tab === "cap" ? "block" : "none");
  $("paneArea").style.display = (tab === "area" ? "block" : "none");
  $("paneStaff").style.display = (tab === "staff" ? "block" : "none");
  
  // フィルタの表示制御
  $("filterContainer").style.display = (tab === "input" || tab === "staff" ? "flex" : "none");
  
  renderCurrentTab();
}

function onWeekChange() { renderCurrentTab(); }
function renderCurrentTab() {
  if(currentTab === "input") renderInputTab();
  else if(currentTab === "cap") renderCapTab();
  else if(currentTab === "area") renderAreaTab();
  else if(currentTab === "staff") renderStaffTab();
}

// --- 📋 実績入力タブ ---
function renderInputTab() {
  var week = $("weekSelect").value;
  var data = getFilteredData();
  var pane = $("paneInput");
  
  if(!db.records[week]) db.records[week] = {};
  if(data.length === 0) { pane.innerHTML = '<div class="empty-msg">該当する従業員がいません。</div>'; return; }
  
  var html = "";
  data.forEach(function(m){
    var rec = db.records[week][m.employeeNo] || 0;
    
    html += '<div class="person-card" style="display:flex; justify-content:space-between; align-items:center;">';
    
    // 均等サイズのテキスト表示
    html += '  <div class="pc-info-text">';
    html += escHtml(m.site) + ' <span class="sep">/</span> ' + escHtml(m.area) + ' <span class="sep">/</span> <span class="name">' + escHtml(m.name) + '</span>';
    html += '  </div>';
    
    html += '  <div style="text-align:right; flex-shrink:0;">';
    html += '    <div style="font-size:12px; color:var(--muted); font-weight:900; margin-bottom:6px;">実績: <span style="font-size:24px; color:var(--primary2);">'+rec+'</span> 件</div>';
    html += '    <div class="pc-btns">';
    html += '      <button class="btn-circle minus" onclick="updateRecord(\''+m.employeeNo+'\', -1)">−</button>';
    html += '      <button class="btn-circle plus" onclick="updateRecord(\''+m.employeeNo+'\', 1)">＋</button>';
    html += '    </div>';
    html += '  </div>';
    html += '</div>';
  });
  pane.innerHTML = html;
}

function updateRecord(empNo, diff) {
  var week = $("weekSelect").value;
  if(!db.records[week]) db.records[week] = {};
  var current = db.records[week][empNo] || 0;
  var next = current + diff;
  if(next < 0) next = 0;
  db.records[week][empNo] = next;
  saveDb();
  renderInputTab();
}

// --- 🎯 全体目標設定タブ ---
function renderCapTab() {
  var week = $("weekSelect").value;
  var pane = $("paneCap");
  
  if(!db.capacities[week]) db.capacities[week] = {};
  var cap = db.capacities[week]["all"] || 0;
  
  var html = '<div style="font-size:13px;color:var(--muted);margin-bottom:16px;font-weight:700;text-align:center;">※今週の「全体の目標件数」を入力してください。<br>入力すると自動で保存されます。</div>';
  
  html += '<div class="card" style="text-align:center; padding: 40px 16px;">';
  html += '  <div style="font-size:18px; font-weight:900; color:var(--primary2); margin-bottom:24px;">🎯 今週の全体目標</div>';
  html += '  <div style="display:flex; justify-content:center; align-items:center; gap:8px;">';
  html += '    <input type="number" class="cap-input" style="width:120px; height:64px; font-size:28px;" min="0" value="'+cap+'" onfocus="this.select()" onchange="updateCap(\'all\', this.value)">';
  html += '    <span style="font-size:18px; font-weight:900; color:var(--text);">件</span>';
  html += '  </div>';
  html += '</div>';
  
  pane.innerHTML = html;
}

function updateCap(key, val) {
  var week = $("weekSelect").value;
  var num = parseInt(val, 10);
  if(isNaN(num) || num < 0) num = 0;
  if(!db.capacities[week]) db.capacities[week] = {};
  db.capacities[week][key] = num;
  saveDb();
  showToast("目標を保存しました");
}

// --- 📈 集計タブ ---
function renderAreaTab() {
  var week = $("weekSelect").value;
  var capWeek = db.capacities[week] || {};
  var recWeek = db.records[week] || {};
  
  var totalCap = capWeek["all"] || 0;
  var totalRec = 0;
  
  var siteStats = {};
  var areaStats = {};

  // 実績の集計
  db.master.forEach(function(m){
    var r = recWeek[m.employeeNo] || 0;
    var aKey = m.site + "_" + m.area;
    
    totalRec += r;
    
    if(!siteStats[m.site]) siteStats[m.site] = 0;
    siteStats[m.site] += r;
    
    if(!areaStats[aKey]) areaStats[aKey] = { site: m.site, area: m.area, rec: 0 };
    areaStats[aKey].rec += r;
  });
  
  var pane = $("paneArea");
  var html = "";
  
  // 全体サマリー
  var rate = calcRate(totalCap, totalRec);
  var totalRateText = totalCap > 0 ? rate + "%" : "--%";
  html += '<div class="summary-box">';
  html += '  <div class="title">🏆 今週の全体達成率</div>';
  html += '  <div class="rate">'+totalRateText+'</div>';
  html += renderBar(rate, totalCap);
  html += '  <div class="nums">目標: '+totalCap+'件 ／ 実績合計: '+totalRec+'件</div>';
  html += '</div>';
  
  // 拠点別・エリア別実績
  var sites = Object.keys(siteStats).sort();
  if(totalRec === 0) {
    html += '<div class="empty-msg">まだ実績が登録されていません。</div>';
    pane.innerHTML = html;
    return;
  }

  sites.forEach(function(site){
    var sRec = siteStats[site];
    if(sRec === 0) return;
    
    html += '<div class="area-group">';
    html += '  <div class="area-title">🏢 '+escHtml(site)+'</div>';
    html += _buildAreaRow("【拠点合計】", sRec, true);
    
    var areas = Object.keys(areaStats).filter(function(k){ return areaStats[k].site === site; }).sort();
    areas.forEach(function(ak){
      var aRec = areaStats[ak].rec;
      if(aRec === 0) return;
      html += _buildAreaRow(areaStats[ak].area, aRec, false);
    });
    
    html += '</div>';
  });
  
  pane.innerHTML = html;
}

function _buildAreaRow(name, rec, isTotal) {
  var fw = isTotal ? "900" : "700";
  var bg = isTotal ? "rgba(236,253,245,0.6)" : "#fff";
  var color = isTotal ? "var(--primary2)" : "var(--text)";
  
  var h = '<div class="area-row" style="background:'+bg+';">';
  h += '  <div class="ar-name" style="font-weight:'+fw+'; color:'+color+';">'+escHtml(name)+'</div>';
  h += '  <div style="font-size:16px; font-weight:900; color:'+color+';">'+rec+' <span style="font-size:12px;font-weight:700;color:var(--muted);">件</span></div>';
  h += '</div>';
  return h;
}

// --- 👤 名簿管理タブ ---
function renderStaffTab() {
  var data = getFilteredData();
  var pane = $("paneStaff");
  
  var defSite = $("fltSite").value || "";
  var defArea = $("fltArea").value || "";
  
  var html = '<div class="card" style="background:#f8fafc; border-color:#cbd5e1; margin-bottom:20px;">';
  html += '<div style="font-size:14px;font-weight:900;margin-bottom:12px;color:var(--primary2);">➕ 新しい人を追加</div>';
  html += '<div class="form-group">';
  html += '  <input type="text" id="addSite" class="form-input" placeholder="拠点 (例: 関東)" value="'+escHtml(defSite)+'">';
  html += '  <input type="text" id="addArea" class="form-input" placeholder="エリア (例: 東京)" value="'+escHtml(defArea)+'">';
  html += '  <input type="text" id="addName" class="form-input" placeholder="氏名 (例: 山田 太郎)">';
  html += '  <button class="btn-primary" onclick="addStaff()">追加する</button>';
  html += '</div></div>';
  
  html += '<div style="font-size:14px;font-weight:900;margin-bottom:12px;color:var(--primary2);">📋 登録済み名簿 ('+data.length+'名)</div>';
  
  if(data.length === 0) {
    html += '<div class="empty-msg">該当する従業員がいません。</div>';
  } else {
    data.forEach(function(m){
      html += '<div class="person-card" style="display:flex; justify-content:space-between; align-items:center;">';
      
      // 均等サイズのテキスト表示
      html += '  <div class="pc-info-text">';
      html += escHtml(m.site) + ' <span class="sep">/</span> ' + escHtml(m.area) + ' <span class="sep">/</span> <span class="name">' + escHtml(m.name) + '</span>';
      html += '  </div>';
      
      html += '  <button class="btn-danger" style="flex-shrink:0;" onclick="deleteStaff(\''+m.employeeNo+'\', \''+escHtml(m.name)+'\')">🗑️ 削除</button>';
      html += '</div>';
    });
  }
  
  pane.innerHTML = html;
}

function addStaff() {
  var site = $("addSite").value.trim();
  var area = $("addArea").value.trim();
  var name = $("addName").value.trim();
  
  if(!site || !area || !name) { alert("「拠点」「エリア」「氏名」をすべて入力してください。"); return; }
  
  var exists = db.master.some(function(m) { return m.site === site && m.area === area && m.name === name; });
  if(exists) { alert("その従業員はすでに登録されています。"); return; }
  
  var newEmpNo = "U" + Date.now();
  db.master.push({ site: site, area: area, name: name, employeeNo: newEmpNo });
  saveDb();
  
  $("fltSite").value = site;
  initFilters(); 
  $("fltArea").value = area;
  
  showToast("👤 名簿に追加しました");
  renderCurrentTab();
}

function deleteStaff(empNo, name) {
  if(!confirm("「" + name + "」さんを名簿から削除しますか？\n※この操作は取り消せません。")) return;
  db.master = db.master.filter(function(m){ return m.employeeNo !== empNo; });
  saveDb();
  initFilters();
  showToast("🗑️ 削除しました");
  renderCurrentTab();
}

// ==========================================
// 初期化実行
// ==========================================
loadDb();
initWeekSelect();
initFilters();
switchTab('input'); 
</script>
</body>
</html>
