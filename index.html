<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>エアコン修理 7・8月 集計ツール</title>
  <style>
    :root{
      --bg1: rgba(236,253,245,0.98);
      --bg2: rgba(209,250,229,0.70);
      --card: rgba(255,255,255,0.95);
      --line: rgba(167,243,208,0.95);
      --text: #064e3b;
      --muted: rgba(6,78,59,0.65);
      --primary: rgba(16,185,129,0.96);
      --primary2: rgba(4,120,87,0.98);
      --shadow: 0 12px 26px rgba(4,120,87,0.08);
      --radius: 20px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top left,var(--bg2),transparent 36%),linear-gradient(180deg,var(--bg1),rgba(255,255,255,0.98));
      -webkit-tap-highlight-color:transparent;
      padding-bottom:32px;
    }
    .app{max-width:760px;margin:0 auto;padding:16px 12px;}
    
    .header-bar{text-align:center;margin-bottom:16px;padding-bottom:16px;border-bottom:2px solid var(--line);}
    .header-bar h1{margin:0 0 4px;font-size:20px;color:var(--primary2);line-height:1.2;}
    .header-bar p{margin:0;font-size:12px;color:var(--muted);font-weight:700;}

    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
    
    /* 共通ボタン */
    .btn{min-height:44px;padding:8px 12px;border:0;font-weight:900;font-size:14px;cursor:pointer;border-radius:12px;transition:all 0.2s;}
    .btn:active{transform:scale(0.96);}
    .btn.primary{background:linear-gradient(180deg,var(--primary),rgba(5,150,105,0.98));color:#fff;box-shadow:0 8px 16px rgba(16,185,129,0.2);}
    .btn.danger{background:rgba(254,226,226,.9);color:#dc2626;}

    /* タブ */
    .tab-bar{display:flex;gap:4px;margin-bottom:16px;}
    .tab-btn{flex:1;min-height:48px;font-size:13px;font-weight:900;border:2px solid var(--line);border-radius:14px;background:rgba(255,255,255,0.9);color:var(--muted);cursor:pointer;padding:0;}
    .tab-btn.active{background:linear-gradient(180deg,var(--primary),rgba(5,150,105,0.98));color:#fff;border-color:transparent;}

    /* フィルタ */
    .filter-row{display:flex;gap:8px;margin-bottom:16px;}
    .filter-row select{-webkit-appearance:none;appearance:none;flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:700;background:rgba(255,255,255,0.9) url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23047857' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 10px center/14px;padding:0 30px 0 12px;color:var(--text);}

    /* リストアイテム */
    .person-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
    .pc-head {
      display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #e2e8f0; padding-bottom:8px; margin-bottom:12px; gap:8px;
    }
    .pc-info-text {
      font-size: 15px; font-weight: 800; color: var(--text); line-height: 1.4; word-break: break-word; flex:1;
    }
    .pc-info-text .sep { color: var(--muted); font-weight: normal; margin: 0 2px; }
    
    /* 人別のカレンダー */
    .person-date {
      width: 140px; height: 38px; border-radius: 8px; border: 2px solid var(--line); text-align: center; font-size: 14px; font-weight: 900; color: var(--primary2); background: #f8fafc; cursor: pointer; flex-shrink: 0;
    }
    .person-date:focus { outline: none; border-color: var(--primary); background: #fff; }

    /* 入力カウンターUI */
    .counter-group { display:flex; gap:12px; }
    .counter-box { flex:1; background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:8px; text-align:center; }
    .counter-label { font-size:11px; font-weight:900; color:var(--muted); margin-bottom:6px; }
    .counter-controls { display:flex; align-items:center; justify-content:center; gap:4px; }
    .btn-circle { width:38px; height:38px; border-radius:10px; border:none; font-size:18px; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .btn-circle:active { transform:scale(0.9); }
    .btn-circle.minus { background:rgba(254,226,226,0.9); color:#dc2626; }
    .btn-circle.plus { background:linear-gradient(180deg,var(--primary),rgba(5,150,105,0.98)); color:#fff; }
    .counter-input { width:48px; height:38px; border:1px solid var(--line); border-radius:8px; text-align:center; font-size:16px; font-weight:900; color:var(--primary2); }
    .counter-input:focus { outline:2px solid rgba(16,185,129,0.3); border-color:var(--primary); }

    /* プログレスバー */
    .prog-wrap{background:rgba(0,0,0,0.06);border-radius:99px;height:10px;overflow:hidden;margin:8px 0;}
    .prog-bar{height:100%;border-radius:99px;transition:width 0.4s ease;}
    .prog-bar.red{background:linear-gradient(90deg,#f87171,#ef4444);}
    .prog-bar.yellow{background:linear-gradient(90deg,#fbbf24,#f59e0b);}
    .prog-bar.green{background:linear-gradient(90deg,#34d399,#10b981);}
    .prog-bar.gray{background:#d1d5db;}
    
    /* 集計表示用 */
    .stats-row { display:flex; justify-content:space-between; align-items:flex-end; font-size:13px; font-weight:900; color:var(--text); }
    .stats-row .rate { font-size:24px; color:var(--primary2); line-height:1; }

    /* 全体サマリーパネル */
    .summary-box{text-align:center;padding:20px 12px;background:rgba(209,250,229,0.3);border-radius:16px;border:1px solid var(--line);margin-bottom:20px;}
    .summary-box .title{font-size:14px;font-weight:900;color:var(--primary2);margin-bottom:12px;}
    .summary-box .rate{font-size:46px;font-weight:1000;color:var(--primary2);line-height:1;margin-bottom:8px;}
    .summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .s-item { background:#fff; border-radius:10px; padding:10px; border:1px solid var(--line); }
    .s-item .lbl { font-size:11px; color:var(--muted); font-weight:900; }
    .s-item .val { font-size:20px; color:var(--primary2); font-weight:900; margin-top:4px; }

    /* トースト */
    .toast{position:fixed;top:40px;left:50%;transform:translate(-50%,-20px);background:rgba(4,120,87,0.95);color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:900;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:1000;opacity:0;pointer-events:none;transition:all 0.3s;}
    .toast.show{opacity:1;transform:translate(-50%,0);}
    
    .empty-msg{text-align:center;padding:32px 16px;color:var(--muted);font-size:14px;font-weight:700;}
  </style>
</head>

// 初期設定時に、7・8月分(idx 16〜77)の合計を計算して目標値(target)とする
function initializeMasterData() {
  var out = [];
  DEFAULT_MASTER_BASE.forEach(function(m) {
    var target = 0;
    var aData = CAP_DATA_RAW.find(function(c) { return c.site === m.site && c.area === m.area; });
    if(aData && aData.persons && aData.persons[m.name]) {
      var arr = aData.persons[m.name];
      for(var i=16; i<=77; i++) {
        target += (arr[i] || 0);
      }
    } else {
      target = 21; 
    }
    out.push({ site: m.site, area: m.area, name: m.name, employeeNo: m.employeeNo, target: target });
  });
  return out;
}

// ==========================================
// 日付関数
// ==========================================
function getTodayStr() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  return y + "-" + m + "-" + dd;
}

function isTargetMonth(dateStr) {
  if(!dateStr || typeof dateStr !== "string" || dateStr.length < 7) return false;
  var m = dateStr.slice(5, 7);
  return (m === "07" || m === "08");
}

// ==========================================
// 初期化
// ==========================================
// ★キーを更新してクリーンな状態で起動させる
var STORAGE_KEY = "ac_daily_aggregator_v2"; 
var db = { master: [], records: {} };
var currentDates = {}; // { empNo: "YYYY-MM-DD" }

function loadDb() {
  try {
    var data = localStorage.getItem(STORAGE_KEY);
    if(data) db = JSON.parse(data);
  } catch(e) {}
  
  if(!db.master || db.master.length === 0) {
    db.master = initializeMasterData();
  }
  if(!db.records) db.records = {};
}

function saveDb() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e) {}
}

var toastTimer = null;
function showToast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.className = "toast show";
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = "toast"; }, 2000);
}

// ==========================================
// フィルタ
// ==========================================
function unique(arr) { return arr.filter(function(v, i, a){ return a.indexOf(v) === i; }); }
var escHtml = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
var $ = function(id){ return document.getElementById(id); };

function initFilters() {
  var oldSite = $("fltSite").value; 
  var sites = unique(db.master.map(function(m){ return m.site; })).sort();
  var siteHtml = '<option value="">すべての拠点</option>';
  sites.forEach(function(s){ siteHtml += '<option value="'+escHtml(s)+'">'+escHtml(s)+'</option>'; });
  $("fltSite").innerHTML = siteHtml;
  if(sites.indexOf(oldSite) !== -1) $("fltSite").value = oldSite;
  onSiteFilterChange();
}

function onSiteFilterChange() {
  var oldArea = $("fltArea").value;
  var site = $("fltSite").value;
  var areas = unique(db.master.filter(function(m){ return !site || m.site === site; }).map(function(m){ return m.area; })).sort();
  var areaHtml = '<option value="">すべてのエリア</option>';
  areas.forEach(function(a){ areaHtml += '<option value="'+escHtml(a)+'">'+escHtml(a)+'</option>'; });
  $("fltArea").innerHTML = areaHtml;
  if(areas.indexOf(oldArea) !== -1) $("fltArea").value = oldArea;
  renderCurrentTab();
}

function getFilteredData() {
  var site = $("fltSite").value;
  var area = $("fltArea").value;
  return db.master.filter(function(m){
    return (!site || m.site === site) && (!area || m.area === area);
  });
}

// タブ切り替え
// ==========================================
var currentTab = "input";

function switchTab(tab) {
  currentTab = tab;
  $("btnTabInput").className = "tab-btn" + (tab === "input" ? " active" : "");
  $("btnTabArea").className = "tab-btn" + (tab === "area" ? " active" : "");
  $("btnTabStaff").className = "tab-btn" + (tab === "staff" ? " active" : "");
  
  $("paneInput").style.display = (tab === "input" ? "block" : "none");
  $("paneArea").style.display = (tab === "area" ? "block" : "none");
  $("paneStaff").style.display = (tab === "staff" ? "block" : "none");
  
  // フィルタは実績入力・進捗集計で表示
  $("filterContainer").style.display = (tab === "input" || tab === "area" ? "flex" : "none");
  
  renderCurrentTab();
}

function renderCurrentTab() {
  if(currentTab === "input") renderInputTab();
  else if(currentTab === "area") renderAreaTab();
  else if(currentTab === "staff") renderStaffTab();
}

// --- 📋 実績入力タブ ---
function renderInputTab() {
  var data = getFilteredData();
  var pane = $("paneInput");
  
  if(data.length === 0) { pane.innerHTML = '<div class="empty-msg">該当する従業員がいません。</div>'; return; }
  
  var html = '<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:12px;text-align:center;">※人ごとに日付を選んで、<br>その日の「受付数」「完了数」を入力してください。</div>';
  
  var today = getTodayStr();
  
  data.forEach(function(m){
    var empNo = m.employeeNo;
    if(!currentDates[empNo]) currentDates[empNo] = today;
    var dStr = currentDates[empNo];
    
    if(!db.records[dStr]) db.records[dStr] = {};
    if(!db.records[dStr][empNo]) db.records[dStr][empNo] = { assigned: 0, completed: 0 };
    var rec = db.records[dStr][empNo];
    
    html += '<div class="person-card">';
    html += '  <div class="pc-head">';
    html += '    <div class="pc-info-text" style="border:none; padding:0; margin:0;">'+escHtml(m.site)+' <span class="sep">/</span> '+escHtml(m.area)+' <span class="sep">/</span> <span style="color:var(--primary2);">'+escHtml(m.name)+'</span></div>';
    html += '    <input type="date" class="person-date" value="'+dStr+'" onchange="changePersonDate(\''+empNo+'\', this.value)">';
    html += '  </div>';
    
    html += '  <div class="counter-group">';
    
    // 受付件数
    html += '    <div class="counter-box">';
    html += '      <div class="counter-label">当日の受付数</div>';
    html += '      <div class="counter-controls">';
    html += '        <button class="btn-circle minus" onclick="updateCounter(\''+empNo+'\', \'assigned\', -1)">−</button>';
    html += '        <input type="number" class="counter-input" min="0" value="'+rec.assigned+'" onchange="setCounter(\''+empNo+'\', \'assigned\', this.value)" onfocus="this.select()">';
    html += '        <button class="btn-circle plus" onclick="updateCounter(\''+empNo+'\', \'assigned\', 1)">＋</button>';
    html += '      </div>';
    html += '    </div>';
    
    // 完了件数
    html += '    <div class="counter-box">';
    html += '      <div class="counter-label">当日の完了数</div>';
    html += '      <div class="counter-controls">';
    html += '        <button class="btn-circle minus" onclick="updateCounter(\''+empNo+'\', \'completed\', -1)">−</button>';
    html += '        <input type="number" class="counter-input" min="0" value="'+rec.completed+'" onchange="setCounter(\''+empNo+'\', \'completed\', this.value)" onfocus="this.select()">';
    html += '        <button class="btn-circle plus" onclick="updateCounter(\''+empNo+'\', \'completed\', 1)">＋</button>';
    html += '      </div>';
    html += '    </div>';
    
    html += '  </div>';
    html += '</div>';
  });
  pane.innerHTML = html;
}

function changePersonDate(empNo, val) {
  currentDates[empNo] = val;
  renderInputTab();
}

function updateCounter(empNo, field, diff) {
  var dStr = currentDates[empNo];
  if(!dStr) dStr = getTodayStr();
  
  if(!db.records[dStr]) db.records[dStr] = {};
  if(!db.records[dStr][empNo]) db.records[dStr][empNo] = { assigned: 0, completed: 0 };
  
  var rec = db.records[dStr][empNo];
  var next = rec[field] + diff;
  if(next < 0) next = 0;
  rec[field] = next;
  
  saveDb();
  renderInputTab(); // 再描画
}

function setCounter(empNo, field, val) {
  var dStr = currentDates[empNo];
  if(!dStr) dStr = getTodayStr();
  
  if(!db.records[dStr]) db.records[dStr] = {};
  if(!db.records[dStr][empNo]) db.records[dStr][empNo] = { assigned: 0, completed: 0 };
  
  var num = parseInt(val, 10);
  if(isNaN(num) || num < 0) num = 0;
  db.records[dStr][empNo][field] = num;
  
  saveDb();
  showToast("保存しました");
  renderInputTab();
}

// --- 📈 進捗集計タブ ---
function renderAreaTab() {
  var data = getFilteredData();
  var pane = $("paneArea");
  
  // 7,8月分のレコードを全て走査し、個人ごとの「累計」を算出
  var agg = {};
  for(var dateStr in db.records) {
    if(!isTargetMonth(dateStr)) continue;
    var daily = db.records[dateStr];
    if(typeof daily !== "object" || daily === null) continue;
    
    for(var empNo in daily) {
      var r = daily[empNo];
      if(typeof r !== "object" || r === null) continue;
      
      if(!agg[empNo]) agg[empNo] = { assigned: 0, completed: 0 };
      agg[empNo].assigned += (r.assigned || 0);
      agg[empNo].completed += (r.completed || 0);
    }
  }
  
  var allTarget = 0, allAssigned = 0, allCompleted = 0;
  var listHtml = "";
  
  data.forEach(function(m){
    var target = m.target || 0;
    var rec = agg[m.employeeNo] || { assigned: 0, completed: 0 };
    
    allTarget += target;
    allAssigned += rec.assigned;
    allCompleted += rec.completed;
    
    var rate = target > 0 ? Math.floor((rec.completed / target) * 100) : 0;
    var barColor = target > 0 ? (rate >= 100 ? "green" : (rate >= 50 ? "yellow" : "red")) : "gray";
    var rateW = Math.min(100, rate);
    
    listHtml += '<div class="person-card">';
    listHtml += '  <div class="pc-info-text">'+escHtml(m.site)+' <span class="sep">/</span> '+escHtml(m.area)+' <span class="sep">/</span> <span style="color:var(--primary2);">'+escHtml(m.name)+'</span></div>';
    
    listHtml += '  <div class="stats-row">';
    listHtml += '    <div style="font-weight:700;">目標(7・8月): <span style="color:var(--primary2);">'+target+'</span> 件<br>受付累計: <span style="color:var(--primary2);">'+rec.assigned+'</span> 件<br>完了累計: <span style="color:var(--primary2);">'+rec.completed+'</span> 件</div>';
    listHtml += '    <div class="rate">'+(target>0 ? rate+"%" : "--%")+'</div>';
    listHtml += '  </div>';
    listHtml += '  <div class="prog-wrap"><div class="prog-bar '+barColor+'" style="width:'+rateW+'%"></div></div>';
    listHtml += '</div>';
  });
  
  var html = "";
  var allRate = allTarget > 0 ? Math.floor((allCompleted / allTarget) * 100) : 0;
  
  // 全体サマリー
  html += '<div class="summary-box">';
  html += '  <div class="title">🎯 表示中メンバーの全体進捗 (7・8月累計)</div>';
  html += '  <div class="rate">'+(allTarget > 0 ? allRate + "%" : "--%")+'</div>';
  html += '  <div class="prog-wrap" style="height:12px;"><div class="prog-bar '+(allRate>=100?"green":(allRate>=50?"yellow":"red"))+'" style="width:'+Math.min(100, allRate)+'%"></div></div>';
  
  html += '  <div class="summary-grid">';
  html += '    <div class="s-item"><div class="lbl">総目標件数</div><div class="val">'+allTarget+'</div></div>';
  html += '    <div class="s-item"><div class="lbl">受付数累計</div><div class="val">'+allAssigned+'</div></div>';
  html += '    <div class="s-item" style="grid-column:1 / span 2;"><div class="lbl">完了数累計</div><div class="val" style="font-size:28px;">'+allCompleted+'</div></div>';
  html += '  </div>';
  html += '</div>';
  
  if(data.length === 0) {
    html += '<div class="empty-msg">該当する従業員がいません。</div>';
  } else {
    html += listHtml;
  }
  
  pane.innerHTML = html;
}

// --- ⚙️ 名簿・目標タブ ---
function renderStaffTab() {
  var data = db.master; // フィルタ対象外
  var pane = $("paneStaff");
  
  var defSite = $("fltSite").value || "";
  var defArea = $("fltArea").value || "";
  
  var html = '<div class="card" style="background:#f8fafc; border-color:#cbd5e1; margin-bottom:20px; box-shadow:none;">';
  html += '<div style="font-size:14px;font-weight:900;margin-bottom:12px;color:var(--primary2);">➕ 新規追加</div>';
  html += '<div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">';
  html += '  <input type="text" id="addSite" placeholder="拠点 (例: 関東)" value="'+escHtml(defSite)+'" style="height:44px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:0 12px;">';
  html += '  <input type="text" id="addArea" placeholder="エリア (例: 東京)" value="'+escHtml(defArea)+'" style="height:44px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:0 12px;">';
  html += '  <input type="text" id="addName" placeholder="氏名 (例: 山田 太郎)" style="height:44px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:0 12px;">';
  html += '  <div style="display:flex; align-items:center; gap:8px;">';
  html += '    <span style="font-size:13px; font-weight:700;">目標(キャパ):</span>';
  html += '    <input type="number" id="addTarget" value="21" min="0" style="width:70px;height:44px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:900;font-size:16px;">';
  html += '    <button class="btn primary" style="flex:1; min-height:44px; padding:0; border-radius:10px;" onclick="addStaff()">追加する</button>';
  html += '  </div>';
  html += '</div></div>';
  
  html += '<div style="font-size:13px; color:var(--muted); font-weight:700; margin-bottom:12px; text-align:center;">※目標件数の数値を変更すると自動保存されます。</div>';
  
  if(data.length === 0) {
    html += '<div class="empty-msg">該当する従業員がいません。</div>';
  } else {
    data.forEach(function(m){
      html += '<div class="person-card" style="display:flex; justify-content:space-between; align-items:center; padding:12px;">';
      
      html += '  <div class="pc-info-text" style="margin-bottom:0; border:none; padding-bottom:0;">';
      html += escHtml(m.site) + ' <span class="sep">/</span> ' + escHtml(m.area) + ' <span class="sep">/</span> <span style="color:var(--primary2);">' + escHtml(m.name) + '</span>';
      html += '  </div>';
      
      html += '  <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">';
      html += '    <div style="display:flex; flex-direction:column; align-items:center;">';
      html += '      <span style="font-size:10px;color:var(--muted);font-weight:900;">目標件数</span>';
      html += '      <input type="number" min="0" value="'+(m.target||0)+'" style="width:64px;height:36px;border-radius:8px;border:2px solid var(--line);text-align:center;font-weight:900;background:#f8fafc;" onfocus="this.select()" onchange="updateStaffTarget(\''+m.employeeNo+'\', this.value)">';
      html += '    </div>';
      html += '    <button class="btn danger" style="min-height:36px; padding:0 12px; font-size:12px; border-radius:8px;" onclick="deleteStaff(\''+m.employeeNo+'\', \''+escHtml(m.name)+'\')">削除</button>';
      html += '  </div>';
      html += '</div>';
    });
  }
  
  pane.innerHTML = html;
}

function updateStaffTarget(empNo, val) {
  var num = parseInt(val, 10);
  if(isNaN(num) || num < 0) num = 0;
  for(var i=0; i<db.master.length; i++) {
    if(db.master[i].employeeNo === empNo) {
      db.master[i].target = num;
      break;
    }
  }
  saveDb();
  showToast("目標件数を更新しました");
}

function addStaff() {
  var site = $("addSite").value.trim();
  var area = $("addArea").value.trim();
  var name = $("addName").value.trim();
  var tgt  = parseInt($("addTarget").value, 10) || 0;
  
  if(!site || !area || !name) { alert("「拠点」「エリア」「氏名」を入力してください。"); return; }
  
  var exists = db.master.some(function(m) { return m.site === site && m.area === area && m.name === name; });
  if(exists) { alert("その従業員はすでに登録されています。"); return; }
  
  var newEmpNo = "U" + Date.now();
  db.master.push({ site: site, area: area, name: name, employeeNo: newEmpNo, target: tgt });
  saveDb();
  
  $("fltSite").value = site;
  initFilters(); 
  $("fltArea").value = area;
  
  showToast("👤 名簿に追加しました");
  renderCurrentTab();
}

function deleteStaff(empNo, name) {
  if(!confirm("「" + name + "」さんを名簿から削除しますか？\n※これまでの報告データも集計から除外されます。")) return;
  db.master = db.master.filter(function(m){ return m.employeeNo !== empNo; });
  saveDb();
  initFilters();
  showToast("🗑️ 削除しました");
  renderCurrentTab();
}

// ==========================================
// 初期化実行
// ==========================================
loadDb();
initFilters();
switchTab('input');
</script>
</body>
</html>
