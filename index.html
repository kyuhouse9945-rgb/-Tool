<index.html>
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>エアコン修理実績報告</title>
  <style>
    :root{
      --bg1: rgba(236,253,245,0.98);
      --bg2: rgba(209,250,229,0.70);
      --card: rgba(255,255,255,0.92);
      --line: rgba(167,243,208,0.95);
      --text: #064e3b;
      --muted: rgba(6,78,59,0.65);
      --primary: rgba(16,185,129,0.96);
      --primary2: rgba(4,120,87,0.98);
      --shadow: 0 12px 26px rgba(4,120,87,0.08);
      --radius: 20px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top left,var(--bg2),transparent 36%),linear-gradient(180deg,var(--bg1),rgba(255,255,255,0.98));
      -webkit-tap-highlight-color:transparent;
      padding-bottom:24px;
    }
    .app{max-width:760px;margin:0 auto;padding:16px 12px;}
    .page-title{text-align:center;margin:24px 0 32px;}
    .page-title h1{margin:0 0 8px;font-size:22px;color:var(--primary2);line-height:1.2;}
    .page-title p{margin:0;font-size:13px;color:var(--muted);font-weight:700;}
    .header-bar{display:block;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--line);position:relative;text-align:center;}
    .header-bar span{position:absolute;left:0;top:0;font-size:14px;color:var(--primary2);font-weight:900;cursor:pointer;padding:2px 10px 10px 0;}
    .header-bar h2{margin:0;font-size:18px;display:inline-block;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
    .label{display:block;font-size:13px;color:var(--text);margin:0 0 6px;font-weight:800;}
    .field{margin-bottom:12px}
    input,select,textarea,button{-webkit-appearance:none;appearance:none;width:100%;border-radius:16px;border:1px solid var(--line);font-size:16px;background:rgba(255,255,255,.95);color:var(--text);}
    input,select,textarea{min-height:56px;padding:13px 14px;}
    select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23047857' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;background-size:16px;padding-right:40px;}
    textarea{min-height:96px;resize:vertical;line-height:1.45;}
    input:focus,select:focus,textarea:focus{outline:2px solid rgba(16,185,129,0.2);border-color:var(--primary);}
    .btn{min-height:72px;padding:10px 12px;border:0;font-weight:900;cursor:pointer;display:block;text-align:center;border-radius:16px;box-shadow:0 8px 16px rgba(4,120,87,0.1);transition:all 0.2s;}
    .btn:active{transform:scale(0.98);opacity:0.8;}
    .btn.primary{background:linear-gradient(180deg,rgba(16,185,129,0.98),rgba(5,150,105,0.98));color:#fff;}
    .btn.ghost{background:rgba(255,255,255,.95);color:var(--text);border:1px solid var(--line);}
    .btn.danger{background:rgba(254,242,242,.92);color:#991b1b;}
    .btn.big{font-size:24px;padding-top:20px;padding-bottom:20px;}
    .btn.med{font-size:14px;}
    .stack{display:block;}
    .stack>div,.stack>button{margin-bottom:16px;}
    .stack>*:last-child{margin-bottom:0;}
    .row2{display:flex;}
    .row2>button{flex:1;margin-right:8px;}
    .row2>button:last-child{margin-right:0;}

    /* ゲーミフィケーション */
    .g-card{background:#fef3c7;border:2px solid #fde68a;border-radius:var(--radius);padding:16px;margin-bottom:16px;text-align:center;box-shadow:0 8px 20px rgba(217,119,6,0.15);}
    .g-title{font-size:14px;font-weight:900;color:#92400e;margin-bottom:4px;}
    .g-count{font-size:26px;font-weight:1000;color:#d97706;line-height:1.3;margin-bottom:8px;}
    .g-count.zero{font-size:20px;color:#b45309;}
    .g-trophies{display:block;font-size:24px;min-height:32px;}
    .g-trophies span{display:inline-block;margin:0 2px;}
    .g-msg{font-size:12px;color:#b45309;font-weight:700;margin-top:8px;}

    /* キャパバナー */
    .cap-banner{background:linear-gradient(135deg,rgba(16,185,129,0.12),rgba(4,120,87,0.08));border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
    .cap-banner .cap-icon{font-size:28px;}
    .cap-banner .cap-info{flex:1;}
    .cap-banner .cap-label{font-size:12px;color:var(--muted);font-weight:700;}
    .cap-banner .cap-val{font-size:20px;font-weight:1000;color:var(--primary2);}
    .cap-banner .cap-status{font-size:13px;font-weight:900;}
    .cap-banner .cap-status.done{color:#059669;}
    .cap-banner .cap-status.yet{color:#d97706;}
    .cap-banner .cap-status.off{color:var(--muted);}

    /* 信号機 */
    .signal{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;padding:4px 10px;border-radius:20px;}
    .signal.red{background:rgba(254,226,226,0.9);color:#991b1b;}
    .signal.yellow{background:rgba(254,243,199,0.9);color:#92400e;}
    .signal.green{background:rgba(209,250,229,0.9);color:#065f46;}
    .signal.gray{background:rgba(243,244,246,0.9);color:#6b7280;}
    .signal-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .signal.red .signal-dot{background:#ef4444;}
    .signal.yellow .signal-dot{background:#f59e0b;}
    .signal.green .signal-dot{background:#10b981;}
    .signal.gray .signal-dot{background:#9ca3af;}

    /* プログレスバー */
    .prog-wrap{background:rgba(0,0,0,0.06);border-radius:99px;height:10px;overflow:hidden;margin:6px 0 4px;}
    .prog-bar{height:100%;border-radius:99px;transition:width 0.4s ease;}
    .prog-bar.red{background:linear-gradient(90deg,#f87171,#ef4444);}
    .prog-bar.yellow{background:linear-gradient(90deg,#fbbf24,#f59e0b);}
    .prog-bar.green{background:linear-gradient(90deg,#34d399,#10b981);}
    .prog-bar.gray{background:#d1d5db;}

    /* 達成/未達成ボックス */
    .achieve-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
    .achieve-box{border-radius:var(--radius);padding:16px 12px;text-align:center;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent;}
    .achieve-box:active{transform:scale(0.97);}
    .achieve-box.green-box{background:linear-gradient(135deg,rgba(209,250,229,0.95),rgba(167,243,208,0.8));border:2px solid #6ee7b7;}
    .achieve-box.red-box{background:linear-gradient(135deg,rgba(254,226,226,0.95),rgba(252,165,165,0.6));border:2px solid #fca5a5;}
    .achieve-box .ab-icon{font-size:32px;margin-bottom:4px;}
    .achieve-box .ab-num{font-size:48px;font-weight:1000;line-height:1;}
    .achieve-box.green-box .ab-num{color:#065f46;}
    .achieve-box.red-box .ab-num{color:#991b1b;}
    .achieve-box .ab-label{font-size:13px;font-weight:900;margin-top:6px;}
    .achieve-box.green-box .ab-label{color:#047857;}
    .achieve-box.red-box .ab-label{color:#b91c1c;}
    .achieve-box .ab-sub{font-size:11px;font-weight:700;margin-top:4px;opacity:0.8;}
    .achieve-box.green-box .ab-sub{color:#065f46;}
    .achieve-box.red-box .ab-sub{color:#991b1b;}

    /* モーダル */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
    .modal-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:760px;max-height:80vh;overflow-y:auto;padding:20px 16px 32px;}
    .modal-handle{width:40px;height:4px;background:#d1d5db;border-radius:99px;margin:0 auto 16px;}
    .modal-title{font-size:16px;font-weight:900;color:var(--primary2);margin-bottom:12px;text-align:center;}

    /* 人物リスト */
    .person-row{display:flex;align-items:center;padding:10px 12px;border-radius:14px;margin-bottom:6px;background:rgba(255,255,255,0.9);border:1px solid var(--line);}
    .person-row .avatar{width:32px;height:32px;border-radius:50%;flex:0 0 32px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;margin-right:10px;}
    .person-row.done-row .avatar{background:#10b981;}
    .person-row.undone-row .avatar{background:#ef4444;}
    .person-row .pr-name{font-weight:900;font-size:14px;}
    .person-row .pr-sub{font-size:11px;color:var(--muted);}
    .person-row .pr-right{margin-left:auto;text-align:right;font-size:12px;font-weight:900;}
    .person-row.done-row .pr-right{color:#059669;}
    .person-row.undone-row .pr-right{color:#dc2626;}

    /* タブ */
    .tab-bar{display:flex;gap:6px;margin-bottom:12px;}
    .tab-btn{flex:1;min-height:44px;font-size:13px;font-weight:900;border:2px solid var(--line);border-radius:14px;background:rgba(255,255,255,0.9);color:var(--muted);cursor:pointer;transition:all 0.2s;}
    .tab-btn.active{background:linear-gradient(180deg,rgba(16,185,129,0.98),rgba(5,150,105,0.98));color:#fff;border-color:transparent;}

    /* エリア進捗 */
    .area-prog-card{background:rgba(255,255,255,0.96);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;}
    .area-prog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
    .area-prog-name{font-size:14px;font-weight:900;color:var(--text);}
    .area-prog-nums{font-size:12px;color:var(--muted);font-weight:700;}

    /* 個人サマリー */
    .summary-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px;}
    .summary-card{background:rgba(255,255,255,0.96);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 6px 14px rgba(4,120,87,0.06);}
    .summary-name{font-size:14px;font-weight:900;color:var(--primary2);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;}
    .summary-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px;}
    .summary-meta .item{background:rgba(209,250,229,0.35);border-radius:12px;padding:8px 6px;text-align:center;}
    .summary-meta .value{display:block;font-size:16px;font-weight:1000;color:var(--text);margin-top:4px;word-break:break-all;}

    /* 本日一覧 */
    .comment-box{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:16px;padding:12px;margin-bottom:8px;}
    .comment-head{display:flex;align-items:flex-start;}
    .avatar{width:28px;height:28px;border-radius:50%;flex:0 0 28px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;margin-right:10px;}
    .comment-name{font-weight:900;line-height:1.2;font-size:14px;}
    .comment-place{font-size:11px;color:var(--muted);line-height:1.2;margin-top:2px;}
    .comment-body{padding:8px 10px;margin-top:8px;font-size:12px;color:#2b3b4a;line-height:1.45;background:rgba(0,0,0,0.03);border-radius:8px;}
    .comment-empty{text-align:center;color:var(--muted);padding:16px;font-size:12px;}

    /* 統計グリッド */
    .stats2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
    .stat2{background:rgba(255,255,255,0.98);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;}
    .stat2 .num2{font-size:28px;font-weight:1000;color:var(--primary2);line-height:1.1;}
    .stat2 .txt2{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;}

    /* トースト */
    .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:rgba(4,120,87,0.95);color:#fff;padding:24px 32px;border-radius:20px;font-size:20px;font-weight:900;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.25);z-index:1000;opacity:0;pointer-events:none;transition:all 0.3s;}
    .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
    @keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(0.9)}100%{transform:scale(1)}}
  </style>
</head>
<body>
<div id="toast" class="toast"></div>

<!-- モーダル -->
<div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="closeModalOutside(event)">
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="app">

  <!-- ===== メニュー ===== -->
  <div id="modeSelect" style="display:block;">
    <div class="page-title">
      <h1>🔧 エアコン修理実績報告</h1>
      <p>利用するメニューを選択してください</p>
    </div>
    <div class="stack">
      <button class="btn primary" style="height:100px;" onclick="showView('worker')">
        <div style="font-size:22px;margin-bottom:6px;">👨‍🔧 作業者用 報告画面</div>
        <div style="font-size:13px;font-weight:normal;opacity:0.9;">本日の実績登録はこちらから</div>
      </button>
      <button class="btn ghost" style="height:100px;border:2px solid var(--primary2);background:rgba(255,255,255,0.95);box-shadow:0 8px 16px rgba(4,120,87,0.12);" onclick="showView('admin')">
        <div style="font-size:22px;margin-bottom:6px;color:var(--primary2);">📊 管理者用 確認画面</div>
        <div style="font-size:13px;font-weight:normal;color:var(--primary2);opacity:0.8;">実績の確認やCSV出力はこちらから</div>
      </button>
    </div>
  </div>

  <!-- ===== 作業者画面 ===== -->
  <div id="workerView" style="display:none;">
    <div class="header-bar">
      <span onclick="showView('menu')">◀ 🏠メニュー</span>
      <h2>📝 作業実績の登録</h2>
    </div>
    <div id="gamificationArea" class="g-card" style="display:none;">
      <div class="g-title" id="gName">👤 --- さんの実績</div>
      <div class="g-count zero" id="gCountText">まだ実績はありません</div>
      <div class="g-trophies" id="gTrophies"></div>
      <div class="g-msg" id="gMsg">まずは1件目を目指しましょう！</div>
    </div>
    <div id="capBanner" style="display:none;" class="cap-banner">
      <div class="cap-icon">📅</div>
      <div class="cap-info">
        <div class="cap-label" id="capLabel">本日のキャパ</div>
        <div class="cap-val" id="capVal">-</div>
      </div>
      <div class="cap-status" id="capStatus"></div>
    </div>
    <div class="card">
      <div class="field">
        <label class="label">🏢 拠点</label>
        <select id="siteSelect"></select>
      </div>
      <div class="field">
        <label class="label">🗺️ エリア</label>
        <select id="areaSelect"></select>
      </div>
      <div class="field">
        <label class="label">👤 氏名</label>
        <select id="personSelect"></select>
      </div>
      <div class="field">
        <label class="label">💬 メモ（任意）</label>
        <textarea id="comment" placeholder="特記事項があれば入力してください"></textarea>
      </div>
      <div class="stack">
        <button class="btn primary big" id="submitBtn">✅ 報告</button>
        <button class="btn ghost med" id="clearBtn">🔄 入力をリセット</button>
      </div>
    </div>
  </div>

  <!-- ===== 管理者画面 ===== -->
  <div id="adminView" style="display:none;">
    <div class="header-bar">
      <span onclick="showView('menu')">◀ 🏠メニュー</span>
      <h2>👑 管理者ダッシュボード</h2>
    </div>

    <!-- 達成/未達成ボックス -->
    <div class="achieve-grid">
      <div class="achieve-box green-box" onclick="openModal('done')">
        <div class="ab-icon">✅</div>
        <div class="ab-num" id="abDoneNum">0</div>
        <div class="ab-label">キャパ達成</div>
        <div class="ab-sub">タップして詳細を見る</div>
      </div>
      <div class="achieve-box red-box" onclick="openModal('undone')">
        <div class="ab-icon">🔴</div>
        <div class="ab-num" id="abUndoneNum">0</div>
        <div class="ab-label">キャパ未達成</div>
        <div class="ab-sub">タップして詳細を見る</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px;text-align:center;">📅 今日の全体進捗</h3>
      <div class="stats2">
        <div class="stat2"><div class="num2" id="statTodayCap">0</div><div class="txt2">📋 本日キャパ合計</div></div>
        <div class="stat2"><div class="num2" id="statTodayDone">0</div><div class="txt2">✅ 本日報告済</div></div>
        <div class="stat2"><div class="num2" id="statPeople">0</div><div class="txt2">👨‍🔧 本日報告者数</div></div>
        <div class="stat2"><div class="num2" id="statTodayRate">0%</div><div class="txt2">📈 本日達成率</div></div>
      </div>
      <div style="padding:0 4px 4px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span style="font-size:12px;font-weight:700;color:var(--muted);">本日進捗</span>
          <span id="adminTodaySignal"></span>
        </div>
        <div class="prog-wrap"><div id="adminTodayBar" class="prog-bar gray" style="width:0%"></div></div>
      </div>
      <div class="row2" style="margin-top:12px;margin-bottom:8px;">
        <button class="btn ghost med" style="min-height:52px;" id="csvBtn">📥 CSV出力</button>
        <button class="btn ghost med" style="min-height:52px;" id="refreshBtn">🔄 更新</button>
      </div>
      <button class="btn danger med" style="min-height:52px;" id="resetAllBtn">🗑️ 全データ削除</button>
    </div>

    <!-- タブ -->
    <div class="card" style="padding-bottom:8px;">
      <div class="tab-bar">
        <button class="tab-btn active" id="tabArea" onclick="switchTab('area')">🗺️ エリア別</button>
        <button class="tab-btn" id="tabPerson" onclick="switchTab('person')">👤 個人別</button>
        <button class="tab-btn" id="tabList" onclick="switchTab('list')">📋 本日一覧</button>
      </div>
      <div id="paneArea"><div id="areaProgContent"></div></div>
      <div id="panePersonAdmin" style="display:none;"><div id="adminSummaryContent" class="summary-grid"></div></div>
      <div id="paneList" style="display:none;"><div id="adminListContent" class="list"></div></div>
    </div>
  </div>

</div>

<script>
// =============================================
//  キャパデータ
// =============================================
var CAP_DATES = (function(){
  var dates=[], d=new Date("2026-06-15"), end=new Date("2026-09-11");
  while(d<=end){
    var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
    dates.push(y+"-"+m+"-"+dd);
    d.setDate(d.getDate()+1);
  }
  return dates;
})();

var pad=function(n){return String(n).length<2?"0"+n:String(n);};

var todayStr=function(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
var unique=function(arr){var r=[];for(var i=0;i<arr.length;i++)if(r.indexOf(arr[i])===-1)r.push(arr[i]);return r;};
var escHtml=function(s){if(s===null||s===undefined)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};
var escCsv=function(v){if(v===null||v===undefined)return'""';return'"'+String(v).replace(/"/g,'""')+'"';};

function dateToIdx(dateStr){
  var d1=new Date("2026-06-15"),d2=new Date(dateStr);
  var diff=Math.round((d2-d1)/86400000);
  if(diff<0||diff>=89)return -1;
  return diff;
}
function getAreaCap(area,dateStr){var idx=dateToIdx(dateStr);if(idx<0)return 0;var d=CAP_DATA[area];if(!d)return 0;return d.cap[idx]||0;}
function getPersonCap(area,name,dateStr){var idx=dateToIdx(dateStr);if(idx<0)return 0;var d=CAP_DATA[area];if(!d||!d.persons[name])return 0;return d.persons[name][idx]||0;}

function signalClass(done,cap){if(cap===0)return"gray";var r=done/cap;if(r>=1)return"green";if(r>=0.5)return"yellow";return"red";}
function signalLabel(done,cap){if(cap===0)return"休業日";var r=done/cap,p=Math.round(r*100);if(r>=1)return"✅ 達成 ("+p+"%)";if(r>=0.5)return"⚠️ 進行中 ("+p+"%)";return"🔴 未達 ("+p+"%)";}
function renderSignal(done,cap){var cls=signalClass(done,cap),lbl=signalLabel(done,cap);return'<span class="signal '+cls+'"><span class="signal-dot"></span>'+escHtml(lbl)+'</span>';}
function renderProgBar(done,cap){var cls=cap===0?"gray":signalClass(done,cap),pct=cap===0?0:Math.min(100,Math.round(done/cap*100));return'<div class="prog-wrap"><div class="prog-bar '+cls+'" style="width:'+pct+'%"></div></div>';}

function loadReports(){try{var d=window.localStorage.getItem(STORAGE_KEY);if(d)return JSON.parse(d);return JSON.parse(memoryStorage);}catch(e){return JSON.parse(memoryStorage);}}
function saveReports(r){var d=JSON.stringify(r);memoryStorage=d;try{window.localStorage.setItem(STORAGE_KEY,d);}catch(e){}}

  sites.forEach(function(s){h+='<option value="'+escHtml(s)+'">'+escHtml(s)+'</option>';});

function initArea(){
  var site=$("siteSelect").value;

  areas.forEach(function(a){h+='<option value="'+escHtml(a)+'">'+escHtml(a)+'</option>';});

}

  var person=null;
  for(var i=0;i<masterData.length;i++){if(masterData[i].employeeNo===empNo){person=masterData[i];break;}}
  if(!person){banner.style.display="none";return;}
  var today=todayStr(),cap=getPersonCap(person.area,person.name,today);
  var reports=loadReports(),todayDone=0;
  for(var j=0;j<reports.length;j++){if(reports[j].employeeNo===empNo&&String(reports[j].createdAt||"").slice(0,10)===today)todayDone++;}
  banner.style.display="flex";
  $("capLabel").textContent=today+" のキャパ";
  if(cap===0){$("capVal").textContent="本日は休業日";$("capStatus").textContent="⚫ 対象外";$("capStatus").className="cap-status off";}
  else{$("capVal").textContent=todayDone+" / "+cap+" 件";if(todayDone>=cap){$("capStatus").textContent="✅ 達成！";$("capStatus").className="cap-status done";}else{$("capStatus").textContent="あと "+(cap-todayDone)+" 件";$("capStatus").className="cap-status yet";}}
}

function updateGamification(isNew){
  var empNo=$("personSelect").value,areaDiv=$("gamificationArea");
  if(!empNo){areaDiv.style.display="none";return;}
  var person=null;
  for(var i=0;i<masterData.length;i++){if(masterData[i].employeeNo===empNo){person=masterData[i];break;}}
  if(!person){areaDiv.style.display="none";return;}
  var reports=loadReports(),myCount=reports.filter(function(r){return r.employeeNo===empNo;}).length;
  var myTrophies=Math.floor(myCount/3),nextTarget=3-(myCount%3);
  areaDiv.style.display="block";
  $("gName").innerHTML="👤 "+escHtml(person.name)+" さんの実績";
  if(myCount===0){$("gCountText").className="g-count zero";$("gCountText").innerHTML="まだ実績はありません";$("gMsg").innerHTML="まずは1件目を目指しましょう！";}
  else{$("gCountText").className="g-count";$("gCountText").innerHTML="トータル <strong>"+myCount+"</strong> 件達成！";$("gMsg").innerHTML=nextTarget===3?"✨キリ番達成！次も頑張りましょう！✨":"あと "+nextTarget+" 件で次のトロフィー！";}
  var tHtml="";
  for(var k=0;k<myTrophies;k++){tHtml+='<span style="'+(isNew&&myCount%3===0&&k===myTrophies-1?'animation:bounce 0.6s 3;':'')+'">🏆</span>';}
  if(myTrophies===0)tHtml="<span style='font-size:14px;color:#b45309;opacity:0.8;'>まだトロフィーはありません。最初の3件を目指そう！</span>";
  $("gTrophies").innerHTML=tHtml;
  if(isNew&&myCount>0&&myCount%3===0)setTimeout(function(){alert("🎉 おめでとうございます！\nトータル "+myCount+" 件達成で新しいトロフィーをゲットしました！🏆");},600);
}

// =============================================
//  管理者画面
// =============================================
function calcTodayStats(){
  var reports=loadReports(),today=todayStr();
  var todayCap=0;
  for(var area in CAP_DATA) todayCap+=getAreaCap(area,today);
  var todayReports=reports.filter(function(r){return String(r.createdAt||"").slice(0,10)===today;});
  var todayDone=todayReports.length;
  var todayPeople=unique(todayReports.map(function(r){return r.employeeNo;})).length;

  // 個人別の達成/未達成カウント（本日キャパ>0の人のみ）
  var doneCount=0,undoneCount=0;
  var donePeople=[],undonePeople=[];
  masterData.forEach(function(m){
    var cap=getPersonCap(m.area,m.name,today);
    if(cap===0)return;
    var done=todayReports.filter(function(r){return r.employeeNo===m.employeeNo;}).length;
    if(done>=cap){doneCount++;donePeople.push({person:m,done:done,cap:cap});}
    else{undoneCount++;undonePeople.push({person:m,done:done,cap:cap});}
  });
  return{todayCap:todayCap,todayDone:todayDone,todayPeople:todayPeople,doneCount:doneCount,undoneCount:undoneCount,donePeople:donePeople,undonePeople:undonePeople};
}

function renderAdmin(){
  var s=calcTodayStats();
  var today=todayStr();
  $("abDoneNum").textContent=s.doneCount;
  $("abUndoneNum").textContent=s.undoneCount;
  $("statTodayCap").textContent=s.todayCap;
  $("statTodayDone").textContent=s.todayDone;
  $("statPeople").textContent=s.todayPeople;
  var rate=s.todayCap>0?Math.round(s.todayDone/s.todayCap*100):0;
  $("statTodayRate").textContent=rate+"%";
  var cls=signalClass(s.todayDone,s.todayCap);
  $("adminTodaySignal").innerHTML=renderSignal(s.todayDone,s.todayCap);
  var bar=$("adminTodayBar");
  bar.className="prog-bar "+cls;
  bar.style.width=(s.todayCap>0?Math.min(100,Math.round(s.todayDone/s.todayCap*100)):0)+"%";
  renderAreaProg();
  renderAdminSummary();
  renderAdminList();
}

// モーダル
function openModal(type){
  var s=calcTodayStats();
  var today=todayStr();
  var title,people,rowClass,rightText;
  if(type==="done"){
    title="✅ キャパ達成 "+s.doneCount+"名";
    people=s.donePeople;rowClass="done-row";
    rightText=function(p){return"✅ "+p.done+"/"+p.cap+"件";};
  }else{
    title="🔴 キャパ未達成 "+s.undoneCount+"名";
    people=s.undonePeople;rowClass="undone-row";
    rightText=function(p){return"🔴 "+p.done+"/"+p.cap+"件";};
  }
  $("modalTitle").textContent=title;
  var html="";
  if(people.length===0){html='<div class="comment-empty">該当者はいません</div>';}
  else{
    people.sort(function(a,b){return a.person.site.localeCompare(b.person.site,"ja");});
    people.forEach(function(p){
      var m=p.person;
      html+='<div class="person-row '+rowClass+'">';
      html+='<div class="avatar">'+escHtml(m.name.slice(0,1))+'</div>';
      html+='<div style="flex:1;"><div class="pr-name">'+escHtml(m.name)+'</div>';
      html+='<div class="pr-sub">'+escHtml(m.site)+" / "+escHtml(m.area)+'</div></div>';
      html+='<div class="pr-right">'+rightText(p)+'</div></div>';
    });
  }
  $("modalBody").innerHTML=html;
  $("modalOverlay").style.display="flex";
}
function closeModalOutside(e){if(e.target===$("modalOverlay"))$("modalOverlay").style.display="none";}

function renderAreaProg(){
  var reports=loadReports(),today=todayStr(),donByArea={};
  reports.forEach(function(r){if(String(r.createdAt||"").slice(0,10)===today)donByArea[r.area]=(donByArea[r.area]||0)+1;});
  var siteAreas={};
  for(var area in CAP_DATA){var s=CAP_DATA[area].site;if(!siteAreas[s])siteAreas[s]=[];siteAreas[s].push(area);}
  var sites=Object.keys(siteAreas).sort(function(a,b){return a.localeCompare(b,"ja");});
  var html="";
  sites.forEach(function(site){
    var areas=siteAreas[site].sort(function(a,b){return a.localeCompare(b,"ja");});
    html+='<div style="margin-bottom:16px;"><div style="font-size:13px;font-weight:900;color:var(--primary2);margin-bottom:6px;padding:4px 8px;background:rgba(209,250,229,0.4);border-radius:10px;">🏢 '+escHtml(site)+'</div>';
    areas.forEach(function(area){
      var cap=getAreaCap(area,today),done=donByArea[area]||0;
      html+='<div class="area-prog-card"><div class="area-prog-head"><span class="area-prog-name">'+escHtml(area)+'</span>'+renderSignal(done,cap)+'</div>';
      html+='<div class="area-prog-nums">報告済 '+done+' 件 ／ 本日キャパ '+cap+' 件</div>'+renderProgBar(done,cap)+'</div>';
    });
    html+='</div>';
  });
  $("areaProgContent").innerHTML=html;
}

function renderAdminSummary(){
  var reports=loadReports(),today=todayStr(),currentMonth=today.slice(0,7),byEmp={};
  reports.forEach(function(r){
    if(!r.employeeNo)return;
    if(!byEmp[r.employeeNo])byEmp[r.employeeNo]={employeeNo:r.employeeNo,personName:r.personName||"",site:r.site||"",area:r.area||"",totalCount:0,latestAt:"",monthCount:0,todayDone:0,todayCap:0};
    byEmp[r.employeeNo].totalCount++;
    if(!byEmp[r.employeeNo].latestAt||byEmp[r.employeeNo].latestAt<r.createdAt)byEmp[r.employeeNo].latestAt=r.createdAt||"";
    if(String(r.createdAt||"").slice(0,7)===currentMonth)byEmp[r.employeeNo].monthCount++;
    if(String(r.createdAt||"").slice(0,10)===today)byEmp[r.employeeNo].todayDone++;
  });
  for(var key in byEmp){var item=byEmp[key];item.todayCap=getPersonCap(item.area,item.personName,today);}
  var list=Object.keys(byEmp).map(function(k){return byEmp[k];});
  list.sort(function(a,b){if(b.monthCount!==a.monthCount)return b.monthCount-a.monthCount;return b.totalCount-a.totalCount;});
  if(list.length===0){$("adminSummaryContent").innerHTML='<div class="comment-empty">まだデータはありません。</div>';return;}
  var html="";
  list.forEach(function(item){
    html+='<div class="summary-card"><div class="summary-name"><span>'+escHtml(item.personName)+' <span style="font-size:11px;color:var(--muted);">('+escHtml(item.employeeNo)+')</span></span>'+renderSignal(item.todayDone,item.todayCap)+'</div>';
    html+='<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">'+escHtml(item.site)+' / '+escHtml(item.area)+'</div>';
    html+=renderProgBar(item.todayDone,item.todayCap);
    html+='<div style="font-size:11px;color:var(--muted);text-align:right;margin-bottom:8px;">本日 '+item.todayDone+'/'+item.todayCap+'件</div>';
    html+='<div class="summary-meta"><div class="item">累計件数<span class="value">'+item.totalCount+'</span></div><div class="item">今月<span class="value">'+item.monthCount+'</span></div><div class="item">最終報告<span class="value" style="font-size:11px;">'+escHtml((item.latestAt||"-").slice(0,16))+'</span></div></div></div>';
  });
  $("adminSummaryContent").innerHTML=html;
}

function renderAdminList(){
  var reports=loadReports().sort(function(a,b){return a.createdAt<b.createdAt?1:-1;}),today=todayStr();
  var todayReports=reports.filter(function(r){return String(r.createdAt||"").slice(0,10)===today;});
  if(todayReports.length===0){$("adminListContent").innerHTML='<div class="comment-empty">本日の報告はまだありません。</div>';return;}
  var html="";
  todayReports.forEach(function(r){
    html+='<div class="comment-box"><div class="comment-head"><div class="avatar">'+escHtml(String(r.personName||"").slice(0,1)||"？")+'</div><div style="flex:1;"><div class="comment-name">'+escHtml(r.personName)+'</div><div class="comment-place">'+escHtml(r.site)+' / '+escHtml(r.area)+'</div></div>';
    html+='<div style="text-align:right;font-size:12px;color:var(--primary2);font-weight:900;">'+escHtml(r.reportType)+'<div style="color:var(--muted);font-weight:normal;margin-top:2px;font-size:11px;">'+escHtml(String(r.createdAt||"").slice(11,16))+'</div></div></div>';
    if(r.comment)html+='<div class="comment-body">'+escHtml(r.comment)+'</div>';
    html+='</div>';
  });
  $("adminListContent").innerHTML=html;
}

var currentTab="area";
function switchTab(tab){
  currentTab=tab;
  $("tabArea").className="tab-btn"+(tab==="area"?" active":"");
  $("tabPerson").className="tab-btn"+(tab==="person"?" active":"");
  $("tabList").className="tab-btn"+(tab==="list"?" active":"");
  $("paneArea").style.display=tab==="area"?"block":"none";
  $("panePersonAdmin").style.display=tab==="person"?"block":"none";
  $("paneList").style.display=tab==="list"?"block":"none";
}

function downloadCsv(){
  var reports=loadReports();
  if(reports.length===0){alert("出力するデータがありません。");return;}
  var csv=["拠点","エリア","氏名","社員番号","区分","作業の種類","メモ","登録日時"].map(escCsv).join(",")+"\n";
  reports.forEach(function(r){csv+=[r.site,r.area,r.personName,r.employeeNo,r.category,r.reportType,r.comment,r.createdAt].map(escCsv).join(",")+"\n";});
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  var url=window.URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="実績報告_"+todayStr()+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);window.URL.revokeObjectURL(url);
}

function showView(viewId){
  $("modeSelect").style.display="none";
  $("workerView").style.display="none";
  $("adminView").style.display="none";
  if(viewId==="worker"){$("workerView").style.display="block";initSite();initArea();initPerson();}
  else if(viewId==="admin"){$("adminView").style.display="block";renderAdmin();switchTab("area");}
  else $("modeSelect").style.display="block";
  window.scrollTo(0,0);
}

$("siteSelect").addEventListener("change",function(){initArea();initPerson();});
$("areaSelect").addEventListener("change",function(){initPerson();});
$("personSelect").addEventListener("change",function(){updateGamification(false);updateCapBanner();});

$("submitBtn").addEventListener("click",function(){
  if(!$("siteSelect").value){alert("拠点を選択してください。");return;}
  if(!$("areaSelect").value){alert("エリアを選択してください。");return;}
  if(!$("personSelect").value){alert("氏名を選択してください。");return;}
  var empNo=$("personSelect").value,person=null;
  for(var i=0;i<masterData.length;i++){if(masterData[i].employeeNo===empNo){person=masterData[i];break;}}
  if(!person){alert("従業員データが見つかりません。");return;}
  var reports=loadReports();
  reports.unshift({site:person.site,area:person.area,personName:person.name,employeeNo:person.employeeNo,category:"PCC",reportType:"修理完了",comment:$("comment").value.replace(/^\s+|\s+$/g,""),createdAt:nowStr()});
  saveReports(reports);
  showToast("✅ 報告が完了しました！<br><span style='font-size:14px;font-weight:normal;display:block;margin-top:6px;'>お疲れ様でした🍵</span>");
  updateGamification(true);updateCapBanner();$("comment").value="";
});

$("clearBtn").addEventListener("click",function(){$("siteSelect").value="";initArea();initPerson();$("comment").value="";});
$("csvBtn").addEventListener("click",downloadCsv);
$("refreshBtn").addEventListener("click",function(){renderAdmin();showToast("🔄 最新状態に更新しました");});
$("resetAllBtn").addEventListener("click",function(){
  if(!confirm("本当に全ての蓄積データを削除しますか？\n（この操作は取り消せません）"))return;
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  memoryStorage="[]";renderAdmin();alert("全データを削除しました。");
});

showView("menu");
