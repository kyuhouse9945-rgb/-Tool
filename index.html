<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>エアコン修理実績報告</title>
  <style>
    :root{
      --bg1: rgba(236, 253, 245, 0.98);
      --bg2: rgba(209, 250, 229, 0.70);
      --card: rgba(255, 255, 255, 0.92);
      --line: rgba(167, 243, 208, 0.95);
      --text: #064e3b;
      --muted: rgba(6, 78, 59, 0.65);
      --primary: rgba(16, 185, 129, 0.96);
      --primary2: rgba(4, 120, 87, 0.98);
      --danger: rgba(220, 38, 38, 0.90);
      --shadow: 0 12px 26px rgba(4, 120, 87, 0.08);
      --radius: 20px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      color:var(--text);
      background: radial-gradient(circle at top left, var(--bg2), transparent 36%), linear-gradient(180deg, var(--bg1), rgba(255,255,255,0.98));
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 24px;
    }

    .app{
      max-width:760px;
      margin:0 auto;
      padding:16px 12px;
    }

    .page-title {
      text-align: center;
      margin: 24px 0 32px;
    }
    .page-title h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: var(--primary2);
      line-height: 1.2;
    }
    .page-title p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .header-bar{
      display:block;
      margin-bottom:16px;
      padding-bottom:12px;
      border-bottom:2px solid var(--line);
      position: relative;
      text-align: center;
    }
    .header-bar span{
      position: absolute;
      left: 0;
      top: 0;
      font-size:14px;
      color:var(--primary2);
      font-weight:900;
      cursor:pointer;
      padding:2px 10px 10px 0;
    }
    .header-bar h2{
      margin:0;
      font-size:18px;
      display: inline-block;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:12px;
    }

    .label{
      display:block;
      font-size:13px;
      color:var(--text);
      margin:0 0 6px;
      font-weight:800;
    }
    .field{margin-bottom:12px}

    input, select, textarea, button{
      -webkit-appearance: none;
      appearance: none;
      width:100%;
      border-radius:16px;
      border:1px solid var(--line);
      font-size:16px;
      background:rgba(255,255,255,.95);
      color: var(--text);
    }
    input, select, textarea{
      min-height:56px;
      padding:13px 14px;
    }
    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23047857' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
      padding-right: 40px;
    }
    textarea{
      min-height:96px;
      resize:vertical;
      line-height:1.45;
    }
    input:focus, select:focus, textarea:focus{
      outline:2px solid rgba(16, 185, 129, 0.2);
      border-color:var(--primary);
    }

    .btn{
      min-height:72px;
      padding:10px 12px;
      border:0;
      font-weight:900;
      cursor:pointer;
      display:block;
      text-align:center;
      border-radius:16px;
      box-shadow:0 8px 16px rgba(4, 120, 87, 0.1);
      transition: all 0.2s;
    }
    .btn:active{ transform:scale(0.98); opacity:0.8; }
    .btn.primary{
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.98), rgba(5, 150, 105, 0.98));
      color:#fff;
    }
    .btn.secondary{
      background:rgba(209, 250, 229, 0.96);
      color:var(--primary2);
    }
    .btn.ghost{
      background:rgba(255,255,255,.95);
      color:var(--text);
      border:1px solid var(--line);
    }
    .btn.danger{
      background:rgba(254,242,242,.92);
      color:#991b1b;
    }
    .btn.big{font-size:24px; padding-top:20px; padding-bottom:20px;}
    .btn.med{font-size:14px;}

    .stack{display:block;}
    .stack > div, .stack > button {margin-bottom:16px;}
    .stack > *:last-child {margin-bottom:0;}

    .row2{display:flex;}
    .row2 > button {flex:1; margin-right:8px;}
    .row2 > button:last-child {margin-right:0;}

    .g-card {
      background: #fef3c7;
      border: 2px solid #fde68a;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.15);
    }
    .g-title {
      font-size: 14px;
      font-weight: 900;
      color: #92400e;
      margin-bottom: 4px;
    }
    .g-count {
      font-size: 26px;
      font-weight: 1000;
      color: #d97706;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .g-count.zero {
      font-size: 20px;
      color: #b45309;
    }
    .g-trophies {
      display: block;
      font-size: 24px;
      min-height: 32px;
    }
    .g-trophies span {
      display: inline-block;
      margin: 0 2px;
    }
    .g-msg {
      font-size: 12px;
      color: #b45309;
      font-weight: 700;
      margin-top: 8px;
    }

    .stats{
      display:block;
      margin-bottom:8px;
    }
    .stat{
      border:1px solid var(--line);
      background:rgba(255,255,255,0.98);
      border-radius:16px;
      padding:16px 12px;
      min-height:80px;
      text-align:center;
      transition: all 0.2s;
    }
    .stat.clickable {
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
      -webkit-tap-highlight-color: transparent;
    }
    .stat.clickable:active {
      transform: scale(0.98);
      background: rgba(209, 250, 229, 0.9);
    }
    .stat .num{
      font-size:36px;
      font-weight:1000;
      line-height:1.05;
      margin-bottom:4px;
      color:var(--primary2);
    }
    .stat .txt{
      font-size:13px;
      color:var(--muted);
      line-height:1.2;
      font-weight:700;
    }

    .list{
      display:block;
      min-height:0;
      overflow:auto;
      padding-right:4px;
    }
    .comment-box{
      position:relative;
      border:1px solid var(--line);
      background:rgba(255,255,255,.92);
      border-radius:16px;
      padding:12px;
      margin-bottom:8px;
    }
    .comment-head{
      display:flex;
      align-items:flex-start;
      margin-bottom:0px;
    }
    .avatar{
      width:28px;
      height:28px;
      border-radius:50%;
      flex:0 0 28px;
      background:var(--primary);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:13px;
      margin-right:10px;
    }
    .comment-name{font-weight:900;line-height:1.2;font-size:14px;}
    .comment-place{font-size:11px;color:var(--muted);line-height:1.2;margin-top:2px;}
    .comment-body{
      padding:8px 10px;
      margin-top:8px;
      font-size:12px;
      color:#2b3b4a;
      line-height:1.45;
      background:rgba(0,0,0,0.03);
      border-radius:8px;
    }
    .comment-empty{text-align:center;color:var(--muted);padding:16px;font-size:12px;}

    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(4, 120, 87, 0.95);
      color: #fff;
      padding: 24px 32px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @keyframes bounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.3); }
      60% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
  </style>
</head>

    </div>

      <div class="card">

          <label class="label">🗺️ エリア</label>
          <select id="areaSelect"></select>
        </div>
        <div class="field">
          <label class="label">👤 氏名</label>
          <select id="personSelect"></select>
        </div>
        <div class="field">
          <label class="label">💬 メモ（任意）</label>
          <textarea id="comment" placeholder="特記事項があれば入力してください"></textarea>
        </div>
        <div class="stack">
          <button class="btn primary big" id="submitBtn">✅ 報告</button>
          <div class="row2">
            <button class="btn ghost med" id="clearBtn">🔄 入力をリセット</button>
          </div>
        </div>
      </div>
    </div>

    <div id="adminView" style="display: none;">
      <div class="header-bar">
        <span onclick="showView('menu')">◀ 🏠メニュー</span>
        <h2>👑 管理者ダッシュボード</h2>
      </div>

      <div class="card">
        <h3 style="margin-bottom:12px; text-align:center;">📅 今日の確認状況</h3>

        <div class="stats">
          <div class="stat clickable" onclick="showView('admin-list')">
            <div class="num" id="statPeople">0</div>
            <div class="txt">👨‍🔧 今日の報告者数<br><span style="font-size:11px; font-weight:normal; color:var(--primary);">（タップして一覧を見る）</span></div>
          </div>
        </div>

        <div class="row2" style="margin-top:16px; margin-bottom:12px;">
          <button class="btn secondary med" id="csvBtn">📥 実績CSV出力</button>
          <button class="btn ghost med" id="refreshBtn">🔄 最新に更新</button>
        </div>

        <div class="stack" style="margin-top:24px; border-top:1px dashed var(--line); padding-top:16px;">
          <button class="btn danger med" id="resetAllBtn">🗑️ 蓄積データを全削除</button>
        </div>
      </div>
    </div>

    <div id="adminListView" style="display: none;">
      <div class="header-bar">
        <span onclick="showView('admin')">◀ 戻る</span>
        <h2>📋 今日の報告一覧</h2>
      </div>
      <div class="card">
        <div id="adminListContent" class="list" style="max-height: calc(100vh - 160px);"></div>
      </div>
    </div>
  </div>

    var $ = function(id) { return document.getElementById(id); };

    var nowStr = function() {
      var d = new Date();
      var p = function(n) { return String(n).length < 2 ? "0" + n : n; };
      return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    };

    var todayStr = function() {
      var d = new Date();
      var p = function(n) { return String(n).length < 2 ? "0" + n : n; };
      return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
    };

    var unique = function(arr) {
      var res = [];
      for(var i=0; i<arr.length; i++) {
        if(res.indexOf(arr[i]) === -1) res.push(arr[i]);
      }
      return res;
    };

    var escHtml = function(s) {
      if (s === null || s === undefined) return "";
      return String(s)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
    };

    var escCsv = function(v) {
      if (v === null || v === undefined) return '""';
      return '"' + String(v).replace(/"/g, '""') + '"';
    };

    var memoryStorage = "[]";

    function loadReports(){
      try {
        var data = window.localStorage.getItem(STORAGE_KEY);
        if (data) return JSON.parse(data);
        return JSON.parse(memoryStorage);
      } catch(e) {
        return JSON.parse(memoryStorage);
      }
    }

    function saveReports(reports){
      var data = JSON.stringify(reports);
      memoryStorage = data;
      try {
        window.localStorage.setItem(STORAGE_KEY, data);
      } catch(e) {
      }
    }

    function masters(){
      var result = [];
      for(var i=0; i<masterData.length; i++) {
        if(masterData[i].category === "PCC") {
          result.push(masterData[i]);
        }
      }
      return result;
    }

    function initSite(){
      var siteList = [];
      var m = masters();
      for(var i=0; i<m.length; i++) {
        siteList.push(m[i].site);
      }
      var sites = unique(siteList).sort(function(a,b) {
        return a.localeCompare(b, "ja");
      });
      var html = '<option value="">-- 拠点を選ぶ --</option>';
      for(var j=0; j<sites.length; j++) {
        html += '<option value="' + escHtml(sites[j]) + '">' + escHtml(sites[j]) + '</option>';
      }
      $("siteSelect").innerHTML = html;
    }

    function initArea(){
      var site = $("siteSelect").value;
      var areaList = [];
      var m = masters();
      for(var i=0; i<m.length; i++) {
        if (!site || m[i].site === site) areaList.push(m[i].area);
      }
      var areas = unique(areaList).sort(function(a,b) {
        return a.localeCompare(b, "ja");
      });
      var html = '<option value="">-- エリアを選ぶ --</option>';
      for(var j=0; j<areas.length; j++) {
        html += '<option value="' + escHtml(areas[j]) + '">' + escHtml(areas[j]) + '</option>';
      }
      $("areaSelect").innerHTML = html;
    }

    function initPerson(){
      var site = $("siteSelect").value;
      var area = $("areaSelect").value;
      var m = masters();
      var people = [];
      for(var i=0; i<m.length; i++) {
        if ((!site || m[i].site === site) && (!area || m[i].area === area)) {
          people.push(m[i]);
        }
      }
      people.sort(function(a,b) {
        return a.name.localeCompare(b.name, "ja");
      });
      var html = '<option value="">-- 氏名を選ぶ --</option>';
      for(var j=0; j<people.length; j++) {
        html += '<option value="' + escHtml(people[j].employeeNo) + '">' + escHtml(people[j].name) + '（' + escHtml(people[j].employeeNo) + '）</option>';
      }
      $("personSelect").innerHTML = html;
      updateGamification(false);
    }

    function updateGamification(isNewlySubmitted) {
      if(isNewlySubmitted === undefined) isNewlySubmitted = false;

      var empNo = $("personSelect").value;
      var areaDiv = $("gamificationArea");
      var countText = $("gCountText");

      if (!empNo) {
        areaDiv.style.display = "none";
        return;
      }

      var m = masters();
      var person = null;
      for(var i=0; i<m.length; i++) {
        if (m[i].employeeNo === empNo) {
          person = m[i];
          break;
        }
      }

      if (!person) {
        areaDiv.style.display = "none";
        return;
      }

      var allReports = loadReports();
      var myCount = 0;
      for(var j=0; j<allReports.length; j++) {
        if (allReports[j].employeeNo === empNo) myCount++;
      }

      var myTrophies = Math.floor(myCount / 3);
      var nextTarget = 3 - (myCount % 3);

      areaDiv.style.display = "block";
      $("gName").innerHTML = "👤 " + escHtml(person.name) + " さんの実績";

      if (myCount === 0) {
        countText.className = "g-count zero";
        countText.innerHTML = "まだ実績はありません";
        $("gMsg").innerHTML = "まずは1件目を目指しましょう！";
      } else {
        countText.className = "g-count";
        countText.innerHTML = "トータル <strong>" + myCount + "</strong> 件達成！";
        if (nextTarget === 3) {
          $("gMsg").innerHTML = "✨キリ番達成！次も頑張りましょう！✨";
        } else {
          $("gMsg").innerHTML = "あと " + nextTarget + " 件で次のトロフィー！";
        }
      }

      var trophyHtml = "";
      for(var k=0; k<myTrophies; k++){
        var isNew = (isNewlySubmitted && (myCount % 3 === 0) && k === myTrophies - 1);
        trophyHtml += '<span style="' + (isNew ? 'animation: bounce 0.6s 3;' : '') + '">🏆</span>';
      }

      if(myTrophies === 0) {
        trophyHtml = "<span style='font-size:14px; color:#b45309; opacity:0.8;'>まだトロフィーはありません。最初の3件を目指そう！</span>";
      }

      $("gTrophies").innerHTML = trophyHtml;

      if(isNewlySubmitted && myCount > 0 && myCount % 3 === 0) {
        setTimeout(function() {
          alert("🎉 おめでとうございます！\nトータル " + myCount + " 件達成で新しいトロフィーをゲットしました！🏆");
        }, 600);
      }
    }

    function getAllReports(){
      return loadReports().sort(function(a,b) {
        return (a.createdAt < b.createdAt ? 1 : -1);
      });
    }

    function makeAvatar(name){
      var s = String(name || "").replace(/^\s+|\s+$/g, '');
      return s ? s.slice(0,1) : "？";
    }

    function renderAdmin(){
      var reports = getAllReports();
      var today = todayStr();
      var todayReportPeople = [];

      for(var i=0; i<reports.length; i++) {
        var rDate = String(reports[i].createdAt || "").slice(0,10);
        if(rDate === today) {
          todayReportPeople.push(reports[i].employeeNo);
        }
      }
      $("statPeople").innerHTML = unique(todayReportPeople).length;
    }

    function renderAdminList(){
      var reports = getAllReports();
      var today = todayStr();
      var todayReports = [];

      for(var j=0; j<reports.length; j++) {
        var rDate = String(reports[j].createdAt || "").slice(0,10);
        if(rDate === today) todayReports.push(reports[j]);
      }

      if (todayReports.length === 0) {
        $("adminListContent").innerHTML = '<div class="comment-empty">本日の報告はまだありません。</div>';
        return;
      }

      var html = "";
      for(var i=0; i<todayReports.length; i++){
        var r = todayReports[i];
        var commentHtml = "";
        if(r.comment) {
          commentHtml = '<div class="comment-body">' + escHtml(r.comment) + '</div>';
        }

        html += '<div class="comment-box">'
          + '<div class="comment-head">'
          + '<div class="avatar">' + escHtml(makeAvatar(r.personName)) + '</div>'
          + '<div style="flex:1;">'
          + '<div class="comment-name">' + escHtml(r.personName) + '</div>'
          + '<div class="comment-place">' + escHtml(r.site) + ' / ' + escHtml(r.area) + '</div>'
          + '</div>'
          + '<div style="text-align:right; font-size:12px; color:var(--primary2); font-weight:900;">' + escHtml(r.reportType)
          + '<div style="color:var(--muted); font-weight:normal; margin-top:2px; font-size:11px;">' + escHtml(r.createdAt).slice(11, 16) + '</div>'
          + '</div>'
          + '</div>'
          + commentHtml
          + '</div>';
      }

      $("adminListContent").innerHTML = html;
    }

    function downloadCsv(){
      var reports = getAllReports();
      if(reports.length === 0) {
        alert("出力するデータがありません。");
        return;
      }

      var header = ["拠点","エリア","氏名","社員番号","区分","作業の種類","メモ","登録日時"];
      var csv = "";
      var headerArr = [];

      for(var h=0; h<header.length; h++) headerArr.push(escCsv(header[h]));
      csv += headerArr.join(",") + "\n";

      for(var i=0; i<reports.length; i++){
        var r = reports[i];
        var row = [r.site, r.area, r.personName, r.employeeNo, r.category, r.reportType, r.comment, r.createdAt];
        var rowArr = [];
        for(var rIdx=0; rIdx<row.length; rIdx++) rowArr.push(escCsv(row[rIdx]));
        csv += rowArr.join(",") + "\n";
      }

      var blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8;"});
      var url = window.URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "実績報告_" + todayStr() + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }

    function showView(viewId) {
      $("modeSelect").style.display = "none";
      $("workerView").style.display = "none";
      $("adminView").style.display = "none";
      $("adminListView").style.display = "none";

      if (viewId === "worker") {
        $("workerView").style.display = "block";
        initSite();
        initArea();
        initPerson();
      } else if (viewId === "admin") {
        $("adminView").style.display = "block";
        renderAdmin();
      } else if (viewId === "admin-list") {
        $("adminListView").style.display = "block";
        renderAdminList();
      } else {
        $("modeSelect").style.display = "block";
      }

      window.scrollTo(0, 0);
    }

        alert("拠点を選択してください。");
        return;
      }
      if (!$("areaSelect").value) {
        alert("エリアを選択してください。");
        return;
      }
      if (!$("personSelect").value) {
        alert("氏名を選択してください。");
        return;
      }

      var empNo = $("personSelect").value;
      var m = masters();
      var person = null;

      for(var i=0; i<m.length; i++) {
        if(m[i].employeeNo === empNo) {
          person = m[i];
          break;
        }
      }

      if (!person) {
        alert("選択された従業員データが見つかりません。");
        return;
      }

      var reports = loadReports();
      reports.unshift({
        site: person.site,
        area: person.area,
        personName: person.name,
        employeeNo: person.employeeNo,
        category: person.category,
        reportType: "修理完了",
        comment: $("comment").value.replace(/^\s+|\s+$/g, ''),
        createdAt: nowStr()
      });

      saveReports(reports);

      showToast("✅ 報告が完了しました！<br><span style='font-size:14px; font-weight:normal; display:block; margin-top:6px;'>お疲れ様でした🍵</span>");
      updateGamification(true);
      $("comment").value = "";
    });

    $("clearBtn").addEventListener("click", function() {
      $("siteSelect").value = "";
      initArea();
      initPerson();
      $("comment").value = "";
    });

    $("csvBtn").addEventListener("click", downloadCsv);

    $("refreshBtn").addEventListener("click", function() {
      renderAdmin();
      showToast("🔄 最新状態に更新しました");
    });

    $("resetAllBtn").addEventListener("click", function() {
      if (!confirm("本当に全ての蓄積データを削除しますか？\n（この操作は取り消せません）")) return;
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch(e) {
      }
      memoryStorage = "[]";
      renderAdmin();
      alert("全データを削除しました。");
    });

    showView("menu");
  </script>
</body>
</html>
